services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tourism
      POSTGRES_PASSWORD: tourism
      POSTGRES_DB: tourism_ai_visibility
    ports:
      - "5432:5432"
    volumes:
      - tourism_db_data:/var/lib/postgresql/data

volumes:
  tourism_db_data:
