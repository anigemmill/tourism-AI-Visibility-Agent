name: Daily pipeline run

# Alternative to Vercel Cron for non-Vercel deployments. Requires two repo
# secrets: APP_URL (e.g. https://your-app.example.com) and CRON_SECRET
# (must match the CRON_SECRET env var configured on the deployed app).
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the daily pipeline endpoint
        run: |
          curl --fail-with-body -X POST "${{ secrets.APP_URL }}/api/cron/daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
